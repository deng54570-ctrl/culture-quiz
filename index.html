<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8b2f2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>中外文化交流史 · 填空刷题</title>
<style>
:root{
  --bg:#f6efe4; --paper:#fffdf7; --ink:#2e2723; --sub:#8a7d70;
  --line:#e4d8c6; --red:#8b2f2f; --red2:#b8462f; --gold:#b8892f;
  --green:#2f7d54; --green-bg:#e8f4ec; --red-bg:#fbeae7;
  --shadow:0 2px 10px rgba(70,45,20,.08),0 12px 32px rgba(70,45,20,.06);
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}

/* ── 顶栏 ── */
header{
  position:sticky;top:0;z-index:30;background:rgba(246,239,228,.92);
  backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 0 10px;
}
.brand{display:flex;align-items:center;gap:10px}
.seal{
  width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--red),var(--red2));color:#fff;
  font-weight:700;font-size:17px;letter-spacing:-1px;box-shadow:0 3px 8px rgba(139,47,47,.3)
}
.brand h1{margin:0;font-size:16.5px;letter-spacing:.5px}
.brand small{display:block;font-size:11px;color:var(--sub);font-weight:400;letter-spacing:0}

/* ── 卡片 ── */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin:14px 0}
.card h2{margin:0 0 4px;font-size:15px;letter-spacing:.5px}
.hint{font-size:12.5px;color:var(--sub);line-height:1.6;margin:0 0 10px}

/* ── 通用控件 ── */
.seg{display:flex;background:#efe6d8;border-radius:11px;padding:3px;gap:3px;margin-top:8px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13.5px;color:var(--sub);transition:.15s}
.seg button.on{background:#fff;color:var(--red);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{
  padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#fffdf9;
  font-size:13.5px;color:#5b5049;transition:.15s;display:flex;align-items:center;gap:6px
}
.chip .n{font-size:11px;color:var(--sub);background:#f0e7d8;border-radius:999px;padding:1px 6px}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.chip.on .n{background:rgba(255,255,255,.22);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{
  display:block;width:100%;text-align:center;padding:14px;border-radius:13px;
  background:linear-gradient(150deg,var(--red),var(--red2));color:#fff;font-size:16px;
  font-weight:600;letter-spacing:1px;box-shadow:0 6px 16px rgba(139,47,47,.26);margin-top:14px
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fffdf9;color:var(--red);border:1px solid var(--line);box-shadow:none;font-weight:500}
.btn.sm{padding:9px 14px;width:auto;font-size:13.5px;border-radius:10px;margin:0}
.sub{font-size:12px;color:var(--sub)}
.kbd{font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--sub)}

/* ── 答题 ── */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.tagline{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:#f1e8d9;color:#7a6a58;border-radius:999px;padding:2px 9px;font-size:11.5px}
.stem{font-size:17.5px;line-height:2.05;margin:14px 0 6px;letter-spacing:.2px}
.stem .blank{
  display:inline-block;min-width:74px;text-align:center;border-bottom:2px solid var(--gold);
  color:var(--gold);font-weight:600;padding:0 6px;margin:0 2px;border-radius:3px
}
.stem .blank.cur{border-bottom-color:var(--red);color:var(--red);background:#fdf1ee}
.stem .blank.ok{border-bottom-color:var(--green);color:var(--green);background:var(--green-bg)}
.stem .blank.no{border-bottom-color:var(--red2);color:var(--red2);background:var(--red-bg);text-decoration:line-through}
.stem .blank.ans{border-bottom-style:dashed;color:var(--sub);font-weight:400}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.opt{
  display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border-radius:12px;
  border:1px solid var(--line);background:#fffdfa;font-size:15.5px;text-align:left;line-height:1.55;transition:.13s
}
.opt .k{
  flex:none;width:23px;height:23px;border-radius:7px;background:#f1e8d9;color:#7a6a58;
  display:grid;place-items:center;font-size:12.5px;font-weight:700;margin-top:1px
}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--green);background:var(--green-bg)}
.opt.ok .k{background:var(--green);color:#fff}
.opt.no{border-color:var(--red2);background:var(--red-bg)}
.opt.no .k{background:var(--red2);color:#fff}
.opt[disabled]{cursor:default}
.fillin{display:flex;gap:9px;margin-top:14px}
.fillin input{
  flex:1;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fffdfa;
  font:inherit;font-size:16.5px;color:var(--ink);outline:none
}
.fillin input:focus{border-color:var(--red)}
.fillin input.ok{border-color:var(--green);background:var(--green-bg)}
.fillin input.no{border-color:var(--red2);background:var(--red-bg)}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.75;display:none}
.fb.show{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.fb.ok{background:var(--green-bg);border:1px solid #bfe0cc;color:#1f5c3c}
.fb.no{background:var(--red-bg);border:1px solid #f0cdc6;color:#8b2f2f}
.fb b{font-weight:700}
.bar{height:6px;border-radius:99px;background:#ece1d1;overflow:hidden;margin:10px 0 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red2));transition:.25s}
.qfoot{display:flex;gap:9px;align-items:center;margin-top:16px}
.qfoot .sp{flex:1}
.starbig{font-size:22px;line-height:1;padding:7px 10px;border-radius:11px;border:1px solid var(--line);background:#fffdfa}
.starbig.on{color:var(--gold);border-color:#e3c583;background:#fdf6e6}

/* ── 列表 ── */
.list{margin-top:12px}
.item{border:1px solid var(--line);border-radius:13px;background:var(--paper);padding:12px 14px;margin-bottom:10px}
.item .s{font-size:14.5px;line-height:1.85;color:#3b332d}
.item .s .b{color:var(--red2);font-weight:700;border-bottom:1.5px solid var(--red2);padding:0 3px}
.item .m{font-size:11.5px;color:var(--sub);margin-top:7px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item .acts{display:flex;gap:8px;margin-top:9px}
.tinybtn{font-size:12px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:#fffdfa;color:#6b5f54}
.tinybtn.red{color:var(--red);border-color:#e9cdc6}
.empty{text-align:center;color:var(--sub);font-size:13.5px;padding:36px 10px}

/* ── 统计 ── */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.stat{background:#fffdfa;border:1px solid var(--line);border-radius:13px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:21px;color:var(--red);letter-spacing:-.5px}
.stat span{font-size:11.5px;color:var(--sub)}
table.bk{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
table.bk th,table.bk td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
table.bk th{color:var(--sub);font-weight:500;font-size:12px}
table.bk td.r{text-align:right;font-variant-numeric:tabular-nums}
.mini{height:5px;border-radius:99px;background:#ece1d1;overflow:hidden;min-width:52px}
.mini i{display:block;height:100%;background:var(--green)}

/* ── 底部导航 ── */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(255,253,247,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
nav button{flex:1;padding:9px 2px 8px;font-size:10.5px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--red)}
nav button .badge{position:absolute;transform:translate(15px,-7px);background:var(--red);color:#fff;font-size:9.5px;border-radius:99px;padding:1px 5px;min-width:15px;text-align:center}
.view{display:none}
.view.on{display:block}
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);z-index:99;
  background:rgba(46,39,35,.94);color:#fff;font-size:13px;padding:9px 16px;border-radius:99px;
  opacity:0;pointer-events:none;transition:.22s;white-space:nowrap;max-width:86vw
}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(min-width:620px){ .opts.two{display:grid;grid-template-columns:1fr 1fr} }
</style>
</head>
<body>

<header>
  <div class="wrap brand">
    <div class="seal">史</div>
    <h1>中外文化交流史 · 填空题刷题<small id="hdrSub">选择 · 默写 · 错题本 · 收藏</small></h1>
  </div>
</header>

<main class="wrap">

  <!-- ══════════ 首页 / 设置 ══════════ -->
  <section id="v-setup" class="view on">
    <div class="card">
      <h2>① 作答方式</h2>
      <div class="seg" id="segMode">
        <button data-v="choice">选择题（点选项）</button>
        <button data-v="fill">填空默写（打字）</button>
      </div>
    </div>

    <div class="card">
      <h2>② 抽题范围</h2>
      <p class="hint">点板块可只看该部分；不选＝全部 <b id="poolHint"></b></p>
      <div class="seg" id="segScope">
        <button data-v="all">全部题目</button>
        <button data-v="new">未做过</button>
        <button data-v="wrong">错题本</button>
        <button data-v="star">收藏</button>
      </div>
      <div class="chips" id="bookChips"></div>
      <div class="chips" id="chapChips"></div>
    </div>

    <div class="card">
      <h2>③ 顺序与题量</h2>
      <div class="seg" id="segOrder">
        <button data-v="random">随机</button>
        <button data-v="seq">按顺序</button>
      </div>
      <div class="seg" id="segCount">
        <button data-v="20">20 题</button>
        <button data-v="50">50 题</button>
        <button data-v="100">100 题</button>
        <button data-v="all">全部</button>
      </div>
      <div class="seg" id="segAuto">
        <button data-v="1">答对自动下一题</button>
        <button data-v="0">答完停顿等我点</button>
      </div>
    </div>

    <button class="btn" id="startBtn">开始刷题</button>
    <div class="sub" style="text-align:center;margin-top:10px" id="setupStat"></div>
  </section>

  <!-- ══════════ 答题 ══════════ -->
  <section id="v-quiz" class="view">
    <div class="card" style="padding:14px 16px">
      <div class="qhead">
        <span id="qProgress">0 / 0</span>
        <span id="qScore">正确 0</span>
      </div>
      <div class="bar"><i id="qBar" style="width:0%"></i></div>

      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-top:14px">
        <div class="tagline" id="qTags"></div>
        <span class="sub" id="qBlankNote"></span>
      </div>

      <div class="stem" id="qStem"></div>
      <div class="opts" id="qOpts"></div>
      <div class="fillin" id="qFillin" style="display:none">
        <input id="qInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="输入答案后回车">
        <button class="btn sm" id="qSubmit" style="margin:0;padding:12px 18px">提交</button>
      </div>
      <div class="fb" id="qFb"></div>

      <div class="qfoot">
        <button class="starbig" id="qStar" title="收藏">☆</button>
        <span class="sp"></span>
        <button class="btn sm ghost" id="qQuit">结束</button>
        <button class="btn sm" id="qNext" style="display:none">下一题 →</button>
      </div>
    </div>
  </section>

  <!-- ══════════ 错题本 ══════════ -->
  <section id="v-wrong" class="view">
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px">
      <div><b style="font-size:15px">错题本</b> <span class="sub" id="wrongN"></span></div>
      <div class="row" style="gap:8px">
        <button class="btn sm ghost" id="wrongRedo">重做全部</button>
        <button class="btn sm ghost" id="wrongClear">清空</button>
      </div>
    </div>
    <div class="list" id="wrongList"></div>
  </section>

  <!-- ══════════ 收藏 ══════════ -->
  <section id="v-star" class="view">
    <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px">
      <div><b style="font-size:15px">收藏</b> <span class="sub" id="starN"></span></div>
      <button class="btn sm ghost" id="starRedo">复习全部</button>
    </div>
    <div class="list" id="starList"></div>
  </section>

  <!-- ══════════ 统计 ══════════ -->
  <section id="v-stat" class="view">
    <div class="card">
      <h2>总览</h2>
      <div class="statgrid" id="statGrid"></div>
      <div class="bar" style="margin-top:14px"><i id="statBar" style="width:0%"></i></div>
      <div class="sub" style="text-align:center;margin-top:8px" id="statTip"></div>
    </div>
    <div class="card">
      <h2>分板块</h2>
      <table class="bk" id="statTable"></table>
    </div>
    <div class="card">
      <h2>数据</h2>
      <p class="hint">所有记录只存在这台设备的浏览器里，不上传。换设备/清缓存会丢。</p>
      <div class="row">
        <button class="btn sm ghost" id="resetWrong">只清空错题本</button>
        <button class="btn sm ghost" id="resetAll" style="color:var(--red);border-color:#e9cdc6">清空全部记录</button>
      </div>
    </div>
  </section>
</main>

<nav>
  <button data-v="setup" class="on">
    <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>刷题</button>
  <button data-v="wrong">
    <svg viewBox="0 0 24 24"><path d="M6 3h9l5 5v13H6z"/><path d="M9 13l2 2 4-4"/></svg>错题本<i class="badge" id="navWrong" style="display:none"></i></button>
  <button data-v="star">
    <svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>收藏<i class="badge" id="navStar" style="display:none"></i></button>
  <button data-v="stat">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>统计</button>
</nav>

"第一章　第一节　中越早期经济文化联系","num":24,"bi":0,"bn":1,"stem":"东汉末年，________奉母流寓交趾，“无意仕途，锐志于佛道，兼研老子”，著《理惑论》，广引老子和儒家经书，论证释、道、儒观点一致，宣扬佛学。这是佛教已于东汉年间传入越南的一份重要资料。","answer":"牟子（牟博）","alts":["牟子","牟子（牟博）"],"options":["牟子（牟博）","铁制农具","安南都护府","马流（马留）"]},{"id":"中越老柬-25-0","book":"中越老柬","chapter":"第一章　第一节　中越早期经济文化联系","num":25,"bi":0,"bn":1,"stem":"道教是产生于中国的一种宗教，公元2世纪东汉末年创立。道教通过________（南传）和当地信仰传播到越南。","answer":"缅甸","alts":["缅甸"],"options":["土贡","缅甸","高骈","赵佗"]},{"id":"中越老柬-26-0","book":"中越老柬","chapter":"第一章　第一节　中越早期经济文化联系","num":26,"bi":0,"bn":1,"stem":"东汉建安六年（201年），________任交州刺史，“好鬼神事，常著绛帕头巾，鼓琴烧香，读道书”，其行为有助于道教在当地的传播。","answer":"张津","alts":["张津"],"options":["羸陵","葛洪","张津","缅甸"]},{"id":"中越老柬-27-0","book":"中越老柬","chapter":"第一章　第一节　中越早期经济文化联系","num":27,"bi":0,"bn":1,"stem":"东晋著名道教思想家________“年老欲炼丹延寿，闻交趾出丹砂，求为勾漏令”。据越南学者陶维英考证，勾漏县在今越南宁平省安庆县一带。","answer":"葛洪","alts":["葛洪"],"options":["葛洪","赵佗","缅甸","任延"]},{"id":"中越老柬-28-0","book":"中越老柬","chapter":"第一章　第一节　中越早期经济文化联系","num":28,"bi":0,"bn":1,"stem":"据《安南志原》引《交州八县记》所载，隋唐时期交州有名观21所。道教已在越南打下基础并为越南人普遍接受，成为当地的主要宗教之一。唐代________咸通七年（866年）任静海军节度使，他本人信奉道教，推动了道教向安南的传播和发展。","answer":"高骈","alts":["高骈"],"options":["缅甸","羸陵","征侧","高骈"]},{"id":"中越老柬-29-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":29,"bi":0,"bn":1,"stem":"10世纪丁部领建丁朝后，于970年“遣使如宋结好”，972年又遣王子丁琏为贡使入宋朝贡。此后中国王朝与越南的丁、前黎、李、陈诸王朝保持密切的“________”关系。据统计，终宋之世，越南各王朝向宋朝遣使纳贡达57次。","answer":"宗藩（邦交）","alts":["宗藩","宗藩（邦交）"],"options":["占城（占婆）","宗藩（邦交）","险竿（杂技）","丝绸（绸缎）"]},{"id":"中越老柬-30-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":30,"bi":0,"bn":1,"stem":"朝贡贸易是中国与越南之间以朝贡形式进行的官方贸易；而边境地区由地方富商大贾进行的贸易称为________贸易，它是官方贸易的有力补充。","answer":"民间（边境民间）","alts":["民间","民间（边境民间）"],"options":["钦定越史通鉴纲目","伽蓝香（伽南香）","民间（边境民间）","朱舜水（朱之瑜）"]},{"id":"中越老柬-31-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":31,"bi":0,"bn":1,"stem":"宋代中越交通大为发展。北宋首都东京（开封），越南贡使取荆湖路，经桂林、永州、衡阳、长沙、岳州、武昌、信阳、许州抵达东京；南宋首都临安（杭州），贡使取________路至临安。","answer":"江南","alts":["江南"],"options":["占城","阮安","羊皮","江南"]},{"id":"中越老柬-32-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":32,"bi":0,"bn":1,"stem":"广西________为中越两国陆上边境贸易的重要口岸，宋朝在城外开设博易场。","answer":"钦州","alts":["钦州"],"options":["占城","阮攸","钦州","越南"]},{"id":"中越老柬-33-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":33,"bi":0,"bn":1,"stem":"元代初年发生三次侵越战争，关系恶化，战后双方关系恢复。元朝向越南输入药材和________等货物，越南陈朝向元输出土特产品。","answer":"丝绸（绸缎）","alts":["丝绸","丝绸（绸缎）"],"options":["丝绸（绸缎）","宗藩（邦交）","占城（占婆）","险竿（杂技）"]},{"id":"中越老柬-34-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":34,"bi":0,"bn":1,"stem":"明代初年，1400年外戚权臣________篡夺陈朝政权，建立胡朝，明朝出师越南推翻胡朝，并在越南设置郡县进行直接统治，越史上称“属明时期”（1407～1427年）。","answer":"胡季犛","alts":["胡季犛"],"options":["孙中山","胡季犛","大统历","潘佩珠"]},{"id":"中越老柬-35-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":35,"bi":0,"bn":1,"stem":"15世纪黎朝初年是越南封建制度高度发展时期，尤其________在位时期（1460～1497年）达到鼎盛。有明一代，越南遣使人贡达79次，形成中越关系史上的一个高潮。","answer":"黎圣宗","alts":["黎圣宗"],"options":["黎圣宗","孙中山","黎贵惇","阮长祚"]},{"id":"中越老柬-36-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":36,"bi":0,"bn":1,"stem":"黎朝仿效中国“唐律”，参照中国隋唐律例，特别是《唐律疏议》加以补充和条理化，制订了《________》。潘辉注评论说：“洪德刑律，参用隋唐，断治有画一之条，轻重有上下之准，历代遵行，用为成式。”","answer":"洪德刑律","alts":["洪德刑律"],"options":["东游运动","中国音乐","竹林禅派","洪德刑律"]},{"id":"中越老柬-37-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":37,"bi":0,"bn":1,"stem":"1802年阮福映建立阮朝，同年遣使赴清朝请求册封，并请改国名为“南越”，清廷以其地域包括两广，不同意用“南越”，阮福映便把“南越”改为“________”，越南国名自此起始，并沿用至今。","answer":"越南","alts":["越南"],"options":["羊皮","阮安","越南","挽联"]},{"id":"中越老柬-38-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":38,"bi":0,"bn":1,"stem":"中国移民是中国文化在东南亚传播的使者与交流的桥梁。以音乐、戏剧为例，早在公元3世纪，________就随移民南传至越。到15世纪，越南黎朝太宗御用音乐亦系参照中国乐器的特点创制。","answer":"中国音乐","alts":["中国音乐"],"options":["竹林禅派","三教并尊","中国音乐","东游运动"]},{"id":"中越老柬-39-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":39,"bi":0,"bn":1,"stem":"越史记载：元军一位歌手李元吉被俘后，将其技艺传播越南。1350年，元朝人丁庞德带家小南投越南陈朝，越南有“________自此始”。","answer":"险竿（杂技）","alts":["险竿","险竿（杂技）"],"options":["宗藩（邦交）","险竿（杂技）","丝绸（绸缎）","占城（占婆）"]},{"id":"中越老柬-40-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":40,"bi":0,"bn":1,"stem":"明代交趾工匠对中国的贡献尤大。永乐年间驻交趾总兵官等先后三次遣送交趾人才1.6万余人。1413年交趾工匠130多人携眷属至南京。献神枪法、“专督造兵仗局弓箭火药”的是交趾人________，立有大功。","answer":"胡元澄（黎澄）","alts":["胡元澄","胡元澄（黎澄）"],"options":["胡元澄（黎澄）","伽蓝香（伽南香）","占城（占婆）","钦定越史通鉴纲目"]},{"id":"中越老柬-41-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":41,"bi":0,"bn":1,"stem":"交趾人________在北京城建筑上有巨大贡献。他是一名太监，善谋划，尤长于工程建筑，参与营建北京宫室、城郭、庙宇。他设计的紫禁城南北长960米，东西宽760米。他为人清苦介洁。","answer":"阮安","alts":["阮安"],"options":["新州","阮安","儒字","江南"]},{"id":"中越老柬-42-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":42,"bi":0,"bn":1,"stem":"明末著名学者________曾于1645年和1651年两度侨居越南，在会安居住12年，著有《安南记事》，收录其在越南的诗文。","answer":"朱舜水（朱之瑜）","alts":["朱舜水","朱舜水（朱之瑜）"],"options":["伽蓝香（伽南香）","民间（边境民间）","朱舜水（朱之瑜）","科举（三场科举）"]},{"id":"中越老柬-43-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":43,"bi":0,"bn":1,"stem":"越南立国时，南面与________相邻。它位于中南半岛东南沿海地带，故地原为中国汉代所置日南郡象林县。","answer":"占城（占婆）","alts":["占城","占城（占婆）"],"options":["险竿（杂技）","丝绸（绸缎）","占城（占婆）","宗藩（邦交）"]},{"id":"中越老柬-44-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":44,"bi":0,"bn":1,"stem":"据考证，占城的________（即今越南的归仁）是位于南中交通要道上的重要口岸，是通向占城新迁王都佛逝（Vijaya）的港口，中国泛海南航之商船缘云聚于此，“以积薪水”，被称为“南方第一码头”。","answer":"新州","alts":["新州"],"options":["儒字","江南","新州","挽联"]},{"id":"中越老柬-45-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":45,"bi":0,"bn":1,"stem":"郑和船队每次都必在________港口停留并开展贸易，这对于增进中国与占城之间的经济文化交流和古代越南中南部的经济开发有重大推动作用。","answer":"占城","alts":["占城"],"options":["喃字","羊皮","儒字","占城"]},{"id":"中越老柬-46-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":46,"bi":0,"bn":1,"stem":"占城国物产丰富，其特产________“惟此国一大山出产，天下再无出处”，其价甚贵，以银对换。","answer":"伽蓝香（伽南香）","alts":["伽蓝香","伽蓝香（伽南香）"],"options":["伽蓝香（伽南香）","民间（边境民间）","钦定越史通鉴纲目","朱舜水（朱之瑜）"]},{"id":"中越老柬-47-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":47,"bi":0,"bn":1,"stem":"马欢《瀛涯胜览》记载，占城人“书写无纸笔，用________手簿，或树皮熏黑，折成经折，以白粉载字为记”。郑和访问占城时带去了纸笔和墨，促进了当地文化教育的发展。","answer":"羊皮","alts":["羊皮"],"options":[ bn":1,"stem":"越南古典文学名著________（1765～1820年）的六八体长诗《金云翘传》和南方诗人阮廷焘的长篇叙事喃诗，是喃字文学的代表。","answer":"阮攸","alts":["阮攸"],"options":["羊皮","越南","阮攸","新州"]},{"id":"中越老柬-56-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":56,"bi":0,"bn":1,"stem":"18世纪著名思想家________（1726～1784年），曾获榜眼，官至工部尚书，以博学多才、著述宏富著称。其哲学著作有《四书约解》《书经演义》《芸台类语》《群书考辨》《金刚经注解》和《道德经演义》等，学术思想深受宋明理学影响。","answer":"黎贵惇","alts":["黎贵惇"],"options":["阮长祚","黎圣宗","胡志明","黎贵惇"]},{"id":"中越老柬-57-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":57,"bi":0,"bn":1,"stem":"阮朝不仅在北京顺化修建国子监、文庙，而且在各大城镇遍设文庙，春秋祭孔异常隆重。由阮朝国史馆汇集的史家编纂的《________》（49卷）、《大南实录》等均为研究越南历史文化的必读史籍。","answer":"钦定越史通鉴纲目","alts":["钦定越史通鉴纲目"],"options":["民间（边境民间）","科举（三场科举）","伽蓝香（伽南香）","钦定越史通鉴纲目"]},{"id":"中越老柬-58-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":58,"bi":0,"bn":1,"stem":"越南古代文化的兴盛突出表现为教育与科试的发展。史载1195年李朝开始“试三教，赐出身”，1227年陈朝也“试三教子”，使“各承其业”，即同时考儒、释、道三教弟子，体现了“________”的政策。","answer":"三教并尊","alts":["三教并尊"],"options":["中国音乐","洪德刑律","三教并尊","竹林禅派"]},{"id":"中越老柬-59-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":59,"bi":0,"bn":1,"stem":"越南思想家黎贵惇一反朱熹以理为本“有是理便有是气”的观点，认为“________”，可见有的越南思想家并非完全抄袭、借用，而是有所发挥。","answer":"理在气之中，理因气而有","alts":["理在气之中，理因气而有"],"options":["伽蓝香（伽南香）","理在气之中，理因气而有","民间（边境民间）","钦定越史通鉴纲目"]},{"id":"中越老柬-60-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":60,"bi":0,"bn":1,"stem":"19世纪下半叶，在民族存亡关头，越南出现了主张改革的思想家，其中首推________（1828～1871年）。他从1863年3月到1871年11月，先后向阮氏朝廷上书三十多篇，提出经济、国防、外交和文化教育等方面的改革建议。","answer":"阮长祚","alts":["阮长祚"],"options":["一柱寺","胡志明","阮长祚","胡季犛"]},{"id":"中越老柬-61-0","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":61,"bi":0,"bn":2,"stem":"20世纪初，越南维新运动的领袖是________（1867～1940年）和潘周桢（1872～1926年），他们是越南爱国儒生的代表。1904年潘佩珠建立“维新会”，接着发起“________”，组织数百名越南青年赴日留学。","answer":"潘佩珠","alts":["潘佩珠"],"options":["大统历","潘佩珠","冯佐汤","汉越词"]},{"id":"中越老柬-61-1","book":"中越老柬","chapter":"第二章　越南立国后中越文化与宗教关系的广泛发展","num":61,"bi":1,"bn":2,"stem":"20世纪初，越南维新运动的领袖是________（1867～1940年）和潘周桢（1872～1926年），他们是越南爱国儒生的代表。1904年潘佩珠建立“维新会 r":"第九章　中缅文化交流源远流长（姜永仁）","num":24,"bi":0,"bn":1,"stem":"明朝时期，缅甸小乘佛教的建筑艺术、乐曲传入我国云南傣族地区，而中国的饮茶之风则通过云南保山、________地区传入缅甸。","answer":"德宏","alts":["德宏"],"options":["大象","德宏","滇缅","三尺"]},{"id":"中缅印尼中印-25-0","book":"中缅·印尼·中印","chapter":"第九章　中缅文化交流源远流长（姜永仁）","num":25,"bi":0,"bn":1,"stem":"明朝时期傣缅联姻，缅甸东吁王朝公主与西双版纳召片领刀应猛完婚后，在景洪建了一座佛寺，取名“________”，极大地促进了傣族地区佛教的发展。","answer":"金莲寺","alts":["金莲寺"],"options":["吴巴伦","中统钞","德由伽","金莲寺"]},{"id":"中缅印尼中印-26-0","book":"中缅·印尼·中印","chapter":"第九章　中缅文化交流源远流长（姜永仁）","num":26,"bi":0,"bn":1,"stem":"广东省高州城北观山有一株树龄高达300多年的“________树”，据说明朝万历年间缅甸东吁王朝进贡的一批这种树的树仔长成的。","answer":"缅茄","alts":["缅茄"],"options":["吴努","封牛","缅茄","团城"]},{"id":"中缅印尼中印-27-0","book":"中缅·印尼·中印","chapter":"第九章　中缅文化交流源远流长（姜永仁）","num":27,"bi":0,"bn":1,"stem":"缅甸北部克钦邦________一带盛产玉石，著名产地有帕甘、多莫和班苗差等，此外木邦的孟密和孟养的孟拱也是当时缅甸宝石和琥珀的主要产地。","answer":"雾露河","alts":["雾露河"],"options":["宝井谣","唐会要","雾露河","青头船"]},{"id":"中缅印尼中印-28-0","book":"中缅·印尼·中印","chapter":"第九章　中缅文化交流源远流长（姜永仁）","num":28,"bi":0,"bn":1,"stem":"明朝时期每年去缅北开采玉石的中国工人在千人以上，他们把从缅甸开采出来的玉石原石运往我国云南________琢磨加工，制成各种装饰品。","answer":"腾冲","alts":["腾冲"],"options":["腾冲","太虚","尹蓉","手斧"]},{"id":"中缅印尼中印-29-0","book":"中缅·印尼·中印","chapter":"第九章　中缅文化交流源远流长（姜永仁）","num":29,"bi":0,"bn":1,"stem":"明朝时期，缅甸将很多玉佛赠送给我国，如五台山广济茅蓬、四川峨眉山金顶、浙江普陀山文物馆、北京北海________等处都有缅甸赠送的玉佛。","answer":"团城","alts":["团城"],"options":["金箔","团城","蒸馏","碧玉"]},{"id":"中缅印尼中印-30-0","book":"中缅·印尼·中印","chapter":"第九章　中缅文化交流源远流长（姜永仁）","num":30,"bi":0,"bn":1,"stem":"明朝时期，缅甸北部盛产棉花，中国盛产食盐，________贸易是当时中缅之间除丝绸、玉石贸易之外的第三大贸易。","answer":"盐棉","alts":["盐棉"],"options":["食盐","牙雕","海贝","盐棉"]},{"id":"中缅印尼中印-31-0","book":"中缅·印尼·中印","chapter":"第九章　中缅文化交流源远流长（姜永仁）","num":31,"bi":0,"bn":1,"stem":"据陶瓷专家陈万里《中国青瓷史略》记载，13世纪80年代至15世纪40年代的150年间，我国青瓷从福建泉州港大量运到缅甸马达班湾的________。","answer":"毛淡棉","alts":["毛淡棉"],"options":["麟德殿","毛淡棉","蒋梦麟","刀应猛"]},{"id":"中缅印尼中印-32-0","book":"中缅·印尼·中印","chapter":"第九章　中缅文化交流源远流长（姜永仁）","num":32,"bi":0,"bn":1,"stem":"1787年，缅甸波道帕耶王派遣一百多人的使团向清廷进贡，贡品有金叶表文、金塔座、八头驯象、象牙、檀香、宝石、金箔、洋布、漆盒、大呢、________等。","answer":"绒 const byId  = new Map(ITEMS.map(x => [x.id, x]));

/* ─────────── 存储 ─────────── */
const SK = 'cq_v1_';
const LS = {
  get(k, d){ try { const v = localStorage.getItem(SK + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(SK + k, JSON.stringify(v)); } catch(e){} }
};
let stats = LS.get('stats', {});          // id -> {ok:bool, ts}
let wrong = new Set(LS.get('wrong', []));
let star  = new Set(LS.get('star', []));
let conf  = Object.assign(
  { mode:'choice', scope:'all', order:'random', count:'50', auto:'1', books:[], chaps:[] },
  LS.get('conf', {})
);
const saveStats = () => LS.set('stats', stats);
const saveWrong = () => { LS.set('wrong', [...wrong]); paintBadges(); };
const saveStar  = () => { LS.set('star',  [...star ]); paintBadges(); };
const saveConf  = () => LS.set('conf', conf);

/* ─────────── 小工具 ─────────── */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function norm(s){
  return (s || '').toLowerCase()
    .replace(/[\s\u3000]/g,'')
    .replace(/[（）()【】\[\]「」“”"'’‘、，。；：,;:.．·\-—_～~!！?？]/g,'')
    .trim();
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1600);
}
function pct(a,b){ return b ? Math.round(a * 100 / b) : 0; }

/* ─────────── 导航 ─────────── */
function show(v){
  $$('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'wrong') renderList('#wrongList', [...wrong]);
  if (v === 'star')  renderList('#starList',  [...star ]);
  if (v === 'stat')  renderStat();
  if (v === 'setup') renderSetupStat();
  window.scrollTo(0, 0);
}
$$('nav button').forEach(b => b.onclick = () => { if (S.live) stopSession(); show(b.dataset.v); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (S.live) stopSession(); return; }
  if (!S.live || !S.cur) return;
  if (e.target && (e.target.id === 'qInput' || (e.target.tagName || '').toLowerCase() === 'input')) return;
  if (conf.mode === 'choice') {
    if (S.answered) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); advance(); } return; }
    const i = '1234'.indexOf(e.key) >= 0 ? '1234'.indexOf(e.key)
            : 'abcd'.indexOf(e.key.toLowerCase());
    if (i >= 0 && S.cur.options[i] != null) {
      const btn = document.querySelector('#qOpts .opt[data-o="' + i + '"]');
      if (btn) { e.preventDefault(); btn.click(); }
    }
  } else if (S.answered && e.key === 'Enter') {
    e.preventDefault(); advance();
  }
});

/* ─────────── 题目筛选 ─────────── */
function pool(){
  let list = ITEMS;
  if (conf.books.length) list = list.filter(x => conf.books.includes(x.book));
  if (conf.chaps.length) list = list.filter(x => conf.chaps.includes(x.chapter));
  if (conf.scope === 'new')   list = list.filter(x => !stats[x.id]);
  if (conf.scope === 'wrong') list = list.filter(x => wrong.has(x.id));
  if (conf.scope === 'star')  list = list.filter(x => star.has(x.id));
  return list;
}

/* ─────────── 开始会话 ─────────── */
/* 队列以「题」为单位：一道多空题 = 一个组（组内是要依次作答的各空）。
   S.idx = 第几题，S.bi = 这道题的第几空。统计/错题本仍按「空」记。 */
const S = { queue: [], idx: 0, bi: 0, ok: 0, done: 0, cur: null, answered: false, live: false };
const gkey = it => it.book + '#' + it.num;

function groupByQuestion(list){
  const m = new Map();
  for (const it of list){
    const k = gkey(it);
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(it);
  }
  return [...m.values()].map(a => a.sort((x, y) => x.bi - y.bi));
}

function startSession(list){
  if (!list.length) { toast('这个范围里没有题'); return; }
  let q = groupByQuestion(list);
  if (conf.order === 'random') for (let i = q.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [q[i], q[j]] = [q[j], q[i]]; }
  const n = conf.count === 'all' ? q.length : Math.min(+conf.count, q.length);
  S.queue = q.slice(0, n); S.idx = 0; S.bi = 0; S.ok = 0; S.done = 0; S.live = true;
  show('quiz'); nextItem();
}
function stopSession(){ S.live = false; show('setup'); }

function nextItem(){
  if (S.idx >= S.queue.length) { finish(); return; }
  if (S.bi >= S.queue[S.idx].length) { S.idx++; S.bi = 0; return nextItem(); }
  S.cur = S.queue[S.idx][S.bi]; S.answered = false;
  paintQuestion();
}

function blankHTML(item, state, myPick){
  // state: 'idle' | 'ok' | 'no'
  const parts = item.stem.split(/_{2,}/);
  let out = '';
  parts.forEach((p, i) => {
    out += esc(p);
    if (i < parts.length - 1) {
      const isCur = i === item.bi;
      let txt = '　', cls = 'blank';
      if (!isCur) cls += ' ans';
      if (isCur && S.answered) {
        if (state === 'ok') { txt = item.answer; cls += ' ok'; }
        else { txt = myPick || '（未填）'; cls += ' no'; }
      } else if (isCur) {
        txt = item.bn > 1 ? '（第 ' + (item.bi + 1) + ' 空）' : '？';
        cls += ' cur';
      } else {
        const sib = byId.get(item.id.replace(/-\d+$/, '-' + i));
        txt = (S.answered && sib) ? sib.answer : '＿＿';
      }
      out += '<span class="' + cls + '">' + esc(txt) + '</span>';
    }
  });
  return out;
}

function paintQuestion(){
  const it = S.cur;
  $('#qProgress').textContent = '第 ' + (S.idx + 1) + ' / ' + S.queue.length + ' 题';
  $('#qScore').textContent = '正确 ' + S.ok + ' · ' + pct(S.ok, S.done) + '%';
  $('#qBar').style.width = pct(S.idx, S.queue.length) + '%';
  $('#qTags').innerHTML = '<span class="tag">' + esc(it.book) + '</span>' +
    '<span class="tag">' + esc(it.num) + ' 题</span>' +
    (it.bn > 1 ? '<span class="tag">共 ' + it.bn + ' 空</span>' : '');
  $('#qBlankNote').textContent = it.bn > 1 ? '第 ' + (it.bi + 1) + ' 空' : '';
  $('#qStem').innerHTML = blankHTML(it, 'idle');
  $('#qFb').className = 'fb'; $('#qFb').innerHTML = '';
  $('#qNext').style.display = 'none';
  $('#qStar').classList.toggle('on', star.has(it.id));
  $('#qStar').textContent = star.has(it.id) ? '★' : '☆';

  const opts = $('#qOpts'), fill = $('#qFillin');
  if (conf.mode === 'choice') {
    fill.style.display = 'none'; opts.style.display = 'flex';
    const keys = ['A','B','C','D','E','F'];
    opts.className = 'opts' + (it.options.some(o => o.length > 14) ? '' : ' two');
    opts.innerHTML = it.options.map((o, i) =>
      '<button class="opt" data-o="' + i + '"><span class="k">' + keys[i] + '</span><span>' + esc(o) + '</span></button>'
    ).join('');
    opts.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(it.options[+b.dataset.o], b));
  } else {
    opts.style.display = 'none'; fill.style.display = 'flex';
    const inp = $('#qInput'); inp.value = ''; inp.className = ''; inp.disabled = false;
    $('#qSubmit').style.display = ''; $('#qSubmit').disabled = false;
    setTimeout(() => { if (!('ontouchstart' in window)) inp.focus(); }, 60);
  }
  window.scrollTo(0, 0);
}

function judge(it, given){
  const n = norm(given);
  if (!n) return false;
  if (it.alts.some(a => norm(a) === n)) return true;
  // 多义答案：答对其中一段也算对（如「瓷器（陶瓷）」填「陶瓷」）
  if (it.answer.length > 4 && norm(it.answer).includes(n) && n.length >= Math.max(2, norm(it.answer).length - 4)) return true;
  return false;
}

function answer(given, btn){
  const it = S.cur;
  if (S.answered) return;
  if (!btn && !String(given == null ? '' : given).trim()) { toast('先写下答案再提交'); return; }
  S.answered = true; S.done++;
  const ok = judge(it, given);
  if (ok) S.ok++;

  stats[it.id] = { ok: ok, ts: Date.now() };
  if (ok) { if (wrong.has(it.id)) { wrong.delete(it.id); toast('答对了，已移出错题本'); } }
  else    { wrong.add(it.id); }
  saveStats(); saveWrong();

  if (btn) {
    btn.classList.add(ok ? 'ok' : 'no');
    if (!ok) {
      const right = [...$('#qOpts').querySelectorAll('.opt')].find(b => it.options[+b.dataset.o] === it.answer);
      if (right) right.classList.add('ok');
    }
    $('#qOpts').querySelectorAll('.opt').forEach(b => b.disabled = true);
  } else {
    const inp = $('#qInput'); inp.classList.add(ok ? 'ok' : 'no'); inp.disabled = true;
    $('#qSubmit').disabled = true;
  }

  $('#qStem').innerHTML = blankHTML(it, ok ? 'ok' : 'no', given);
  const fb = $('#qFb');
  fb.className = 'fb show ' + (ok ? 'ok' : 'no');
  fb.innerHTML = ok
    ? '✅ <b>答对了</b>' + (it.bn > 1 ? '　本题答案：' + esc(it.answersLine || '') : '')
    : '❌ 正确答案：<b>' + esc(it.answer) + '</b>' + (it.bn > 1 ? '<br><span class="sub">本题全部答案：' + esc(it.answersLine || '') + '</span>' : '');
  $('#qScore').textContent = '正确 ' + S.ok + ' · ' + pct(S.ok, S.done) + '%';
  $('#qNext').style.display = '';
  if (ok && conf.auto === '1') setTimeout(() => { if (S.answered) advance(); }, 620);
}

function advance(){
  // 同一道题还有下一空 → 停在这道题继续；否则进下一题
  const g = S.queue[S.idx] || [];
  if (S.bi < g.length - 1 && g[S.bi + 1]) { S.bi++; nextItem(); return; }
  S.idx++; S.bi = 0;
  if (S.idx >= S.queue.length) finish(); else nextItem();
}

function finish(){
  S.live = false;
  const t = S.done, p = pct(S.ok, t);
  const msg = t === 0 ? '这一轮结束了。' :
    (p >= 90 ? '太强了！' : p >= 70 ? '不错，稳住了。' : p >= 50 ? '还行，错题再刷一遍。' : '基础还得再顺几遍。');
  window.scrollTo(0, 0);
  alert('本轮结束 🎉\n\n共作答 ' + t + ' 空，答对 ' + S.ok + ' 空，正确率 ' + p + '%\n错题已自动收进「错题本」。\n\n' + msg);
  show('setup');
}

/* ─────────── 填空交互 ─────────── */
$('#qSubmit').onclick = () => { if (!S.answered) answer($('#qInput').value.trim()); };
$('#qInput').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (!S.answered) answer($('#qInput').value.trim());
  else advance();
});
$('#qNext').onclick = advance;

/* ─────────── 答题页按钮 ─────────── */
$('#qStar').onclick = () => {
  const it = S.cur;
  if (star.has(it.id)) { star.delete(it.id); toast('已取消收藏'); }
  else { star.add(it.id); toast('已收藏 ★'); }
  saveStar();
  $('#qStar').classList.toggle('on', star.has(it.id));
  $('#qStar').textContent = star.has(it.id) ? '★' : '☆';
};
$('#qQuit').onclick = stopSession;

/* ─────────── 设置面板渲染 ─────────── */
function chipHTML(v, label, n, on){
  return '<button class="chip' + (on ? ' on' : '') + '" data-v="' + esc(v) + '">' + esc(label) +
         (n != null ? '<span class="n">' + n + '</span>' : '') + '</button>';
}
function renderChips(){
  const cnt = {};
  ITEMS.forEach(x => cnt[x.book] = (cnt[x.book] || 0) + 1);
  $('#bookChips').innerHTML = BOOKS.map(b =>
    chipHTML(b, b, cnt[b], conf.books.includes(b))).join('');
  $$('#bookChips .chip').forEach(c => c.onclick = () => {
    const v = c.dataset.v;
    conf.books = conf.books.includes(v) ? conf.books.filter(x => x !== v) : [...conf.books, v];
    conf.chaps = []; saveConf(); renderChips(); renderSetupStat();
  });

  // 章节：仅在选中单个板块时展开
  const box = $('#chapChips');
  if (conf.books.length === 1) {
    const b = conf.books[0];
    const cc = {};
    ITEMS.filter(x => x.book === b).forEach(x => cc[x.chapter] = (cc[x.chapter] || 0) + 1);
    box.innerHTML = Object.keys(cc).map(c => chipHTML(c, c.replace(/^第[一二三四五六七八九十百]+章[　\s]*/, ''), cc[c], conf.chaps.includes(c))).join('');
    $$('#chapChips .chip').forEach(c => c.onclick = () => {
      const v = c.dataset.v;
      conf.chaps = conf.chaps.includes(v) ? conf.chaps.filter(x => x !== v) : [...conf.chaps, v];
      saveConf(); renderChips(); renderSetupStat();
    });
  } else box.innerHTML = '';
}
function renderSegs(){
  [['#segMode','mode'],['#segScope','scope'],['#segOrder','order'],['#segCount','count'],['#segAuto','auto']]
    .forEach(([sel, key]) => $$(sel + ' button').forEach(b => {
      b.classList.toggle('on', String(conf[key]) === b.dataset.v);
      b.onclick = () => { conf[key] = b.dataset.v; saveConf(); renderSegs(); renderSetupStat(); };
    }));
}
function renderSetupStat(){
  const n = pool().length;
  const tot = ITEMS.length, done = Object.keys(stats).length;
  $('#poolHint').textContent = '（本范围 ' + n + ' 个空）';
  $('#setupStat').textContent = '题库共 ' + tot + ' 个空 ｜ 已作答 ' + done + ' ｜ 错题 ' + wrong.size + ' ｜ 收藏 ' + star.size;
}

/* ─────────── 列表（错题本 / 收藏） ─────────── */
function stemLine(it){
  const parts = it.stem.split(/_{2,}/);
  return parts.map((p, i) => esc(p) + (i < parts.length - 1
    ? (i === it.bi ? '<span class="b">' + esc(it.answer) + '</span>' : '<span class="b">（第' + (i + 1) + '空）</span>')
    : '')).join('');
}
let listLimit = 40;
function renderList(sel, ids){
  const box = $(sel);
  if (!ids.length) {
    box.innerHTML = '<div class="empty">' + (sel === '#wrongList' ? '错题本是空的 —— 保持住 👍' : '还没收藏任何题') + '</div>';
    return;
  }
  const showIds = ids.slice(0, listLimit);
  box.innerHTML = showIds.map(id => {
    const it = byId.get(id); if (!it) return '';
    return '<div class="item"><div class="s">' + stemLine(it) + '</div>' +
      '<div class="m"><span class="tag">' + esc(it.book) + '</span><span>' + esc(it.num) + ' 题 · 第 ' + (it.bi + 1) + ' 空</span></div>' +
      '<div class="acts"><button class="tinybtn" data-act="one" data-id="' + id + '">只做这道</button>' +
      '<button class="tinybtn red" data-act="del" data-id="' + id + '">移除</button></div></div>';
  }).join('') + (ids.length > listLimit ? '<button class="btn ghost" id="moreBtn">加载更多（还有 ' + (ids.length - listLimit) + ' 道）</button>' : '');

  box.querySelectorAll('button[data-act]').forEach(b => b.onclick = () => {
    const id = b.dataset.id, fromWrong = sel === '#wrongList';
    if (b.dataset.act === 'del') {
      (fromWrong ? wrong : star).delete(id);
      fromWrong ? saveWrong() : saveStar();
      renderList(sel, fromWrong ? [...wrong] : [...star]);
      toast('已移除');
    } else {
      startSession([byId.get(id)]);
    }
  });
  const mb = box.querySelector('#moreBtn');
  if (mb) mb.onclick = () => { listLimit += 60; renderList(sel, ids); };
}

/* ─────────── 统计 ─────────── */
function renderStat(){
  const ids = Object.keys(stats), okN = ids.filter(id => stats[id].ok).length;
  const seen = ids.length, total = ITEMS.length;
  $('#statGrid').innerHTML =
    '<div class="stat"><b>' + okN + '</b><span>累计答对</span></div>' +
    '<div class="stat"><b>' + pct(okN, seen) + '%</b><span>正确率</span></div>' +
    '<div class="stat"><b>' + wrong.size + '</b><span>错题本</span></div>';
  $('#statBar').style.width = pct(seen, total) + '%';
  $('#statTip').textContent = '已刷 ' + seen + ' / ' + total + ' 空（' + pct(seen, total) + '%）· 收藏 ' + star.size;

  const rows = BOOKS.map(b => {
    const all = ITEMS.filter(x => x.book === b);
    const did = all.filter(x => stats[x.id]);
    const ok  = did.filter(x => stats[x.id].ok);
    const w   = all.filter(x => wrong.has(x.id)).length;
    const rate = pct(ok.length, did.length);
    return '<tr><td>' + esc(b) + '</td>' +
      '<td class="r">' + did.length + '/' + all.length + '</td>' +
      '<td class="r">' + (did.length ? rate + '%' : '—') + '</td>' +
      '<td class="r">' + (w ? '<span style="color:var(--red2)">' + w + '</span>' : '0') + '</td>' +
      '<td style="width:70px"><div class="mini"><i style="width:' + rate + '%"></i></div></td></tr>';
  }).join('');
  $('#statTable').innerHTML = '<tr><th>板块</th><th class="r">已刷</th><th class="r">正确率</th><th class="r">错题</th><th></th></tr>' + rows;
}

/* ─────────── 徽标 / 交互绑定 ─────────── */
function paintBadges(){
  const set = (el, n) => { $(el).style.display = n ? '' : 'none'; $(el).textContent = n > 99 ? '99+' : n; };
  set('#navWrong', wrong.size); set('#navStar', star.size);
  $('#wrongN').textContent = wrong.size ? '（' + wrong.size + ' 空）' : '';
  $('#starN').textContent  = star.size  ? '（' + star.size  + ' 空）' : '';
}
$('#startBtn').onclick = () => { listLimit = 40; startSession(pool()); };
$('#wrongRedo').onclick = () => { if (wrong.size) startSession([...wrong].map(id => byId.get(id)).filter(Boolean)); else toast('错题本是空的'); };
$('#starRedo').onclick  = () => { if (star.size)  startSession([...star ].map(id => byId.get(id)).filter(Boolean)); else toast('还没有收藏'); };
$('#wrongClear').onclick = () => { if (wrong.size && confirm('清空错题本？已刷记录会保留。')) { wrong.clear(); saveWrong(); renderList('#wrongList', []); renderSetupStat(); } };
$('#resetWrong').onclick = () => $('#wrongClear').onclick();
$('#resetAll').onclick = () => {
  if (!confirm('清空全部刷题记录（含正确率、错题本、收藏）？不可恢复。')) return;
  stats = {}; wrong = new Set(); star = new Set();
  saveStats(); saveWrong(); saveStar();
  toast('已全部清空'); renderStat(); renderSetupStat();
};

/* 给每题写入「全部答案」串，供多空题揭晓 */
ITEMS.forEach(it => {
  if (it.bn > 1) {
    const sibs = [];
    for (let i = 0; i < it.bn; i++) { const s = byId.get(it.id.replace(/-\d+$/, '-' + i)); if (s) sibs.push((i + 1) + '.' + s.answer); }
    it.answersLine = sibs.join('　');
  }
});

renderSegs(); renderChips(); paintBadges(); renderSetupStat();
</script>
</body>
</html>
